services:
  metrics-app:
    build:
      context: ../../
      dockerfile: ./e2e/metrics/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.80.0
    command: ["--config", "/otel-local-config.yml"]
    ports:
      # Only the Prometheus exporter endpoint needs a host binding (the app
      # reaches the collector's OTLP port over the compose network). Use a
      # non-default host port to avoid colliding with other local stacks.
      - "18889:8889"
    volumes:
      - ./collector.config.yml:/otel-local-config.yml

networks:
  default:
    name: e2e-metrics
